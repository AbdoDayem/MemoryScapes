[project]
name = "memoryscapes-workers"
version = "0.1.0"
description = "MemoryScapes processing pipeline: ingest, poses, splats, audio, soundscape, publish"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pydantic>=2.7",
  "boto3>=1.34",
  "jsonschema>=4.22",
]

[project.scripts]
memoryscapes-worker = "memoryscapes_workers.cli:main"

[project.optional-dependencies]
# Heavy GPU / ML dependencies are split out so the API and CI stay light.
# AudioSep is not on PyPI: clone https://github.com/Audio-AGI/AudioSep and add it to PYTHONPATH.
# ingest/poses/splat also need the ffmpeg binary. gsplat's kernels need CUDA; on a Mac
# the splat stage uses its pure-PyTorch rasterizer instead (trainer="torch").
visual = ["gsplat>=1.5", "torch", "opencv-python", "pycolmap>=4.2", "transformers>=4.44", "pillow"]
audio = ["torch", "torchaudio", "demucs>=4.0", "transformers>=4.44"]
satie = ["mcp>=1.9"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
# Explicit, so local folders like data/ (pipeline output) aren't picked up as packages.
include = ["memoryscapes_workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
