[project]
name = "memoryscapes-workers"
version = "0.1.0"
description = "MemoryScapes processing pipeline: ingest, poses, splats, audio, soundscape, publish"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "boto3>=1.34",
  "jsonschema>=4.22",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Heavy GPU / ML dependencies are split out so the API and CI stay light.
visual = ["gsplat", "torch", "opencv-python"]
audio = ["torch", "torchaudio", "demucs", "librosa", "pyroomacoustics"]
dev = ["pytest>=8"]
