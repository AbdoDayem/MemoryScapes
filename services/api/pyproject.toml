[project]
name = "memoryscapes-api"
version = "0.1.0"
description = "MemoryScapes API: auth, memories, jobs and globe queries"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "boto3>=1.34",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
# Explicit, so local folders like data/ (the SQLite database) aren't picked up as packages.
include = ["app*"]
