# Local dependencies: Postgres + PostGIS, Redis (job queue), MinIO (S3-compatible storage).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: memoryscapes
      POSTGRES_PASSWORD: memoryscapes
      POSTGRES_DB: memoryscapes
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

volumes:
  pgdata:
  minio:
